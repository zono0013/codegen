# SonarQube Cloud（https://sonarcloud.io/project/overview?id=zono0013_codegen）の解析設定。
# 解析は CI（.github/workflows/sonar.yml）から行う。SonarQube Cloud 側の Automatic Analysis はオフにする。
sonar.organization=zono0013
sonar.projectKey=zono0013_codegen
sonar.projectName=codegen

# ジェネレータ本体と、サンプルの手書きコードを解析する
sonar.sources=cmd,internal,example/server,example/front
sonar.tests=cmd,internal,example/server,example/front,example_test.go
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,\
  **/*.gen.go,**/*.gen.ts,**/*.gen.yaml,\
  internal/gogen/runtime/**,internal/gogen/generator/**,\
  example/front/node_modules/**,example/front/.next/**,example/front/coverage/**,example/front/public/**,\
  example/docs/**

# 生成物は手で直さないので、重複やカバレッジの対象から外す（上の exclusions で解析自体から外している）
sonar.go.coverage.reportPaths=coverage.out,example/server/coverage.out
sonar.javascript.lcov.reportPaths=example/front/coverage/lcov.info
