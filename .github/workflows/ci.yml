name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # PR はブランチごとにまとめ、古い実行を取り消す。main への push はコミットごとに別のグループにして、
  # 続けてマージしても各コミットの結果を残す（同じグループで待機できる実行は 1 つだけで、古い待機は取り消されるため）
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# アクションは、タグではなくコミットハッシュで指定する（タグは後から付け替えられるため）。
# バージョンはコメントで残し、更新は Renovate（helpers:pinGitHubActionDigests）に任せる。
jobs:
  codegen:
    name: codegen（ジェネレータのテストと example/ の生成物の検査）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: make proto-check

  example-server:
    name: example/server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: example/server/go.mod
          cache-dependency-path: example/server/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go mod tidy -diff
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  example-server-postgres:
    name: example/server（Postgres でマイグレーションの SQL を適用）
    runs-on: ubuntu-latest
    services:
      # docker-compose.yml と同じ版。アクションと同じくダイジェストで固定する（更新は Renovate）
      postgres:
        image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: example/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: example/server/go.mod
          cache-dependency-path: example/server/go.sum
      # migration-gen が生成する SQL を実際に適用する（文字列の比較だけでは、Postgres が受け付けるかは分からない）
      - run: go test -count=1 -run Postgres -v ./cmd/migration-gen/
        env:
          MIGRATION_TEST_DATABASE_URL: postgres://app:app@localhost:5432/app?sslmode=disable

  example-server-docker:
    name: example/server（Docker イメージのビルド）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ベースイメージ（golang / alpine）の更新でビルドが壊れたら気づけるように、ビルドだけする（push しない。起動は DB が要るので見ない）
      - run: docker build --pull -t example-server:ci example/server

  example-front:
    name: example/front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example/front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: example/front/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: example/front/.nvmrc
          cache: pnpm
          cache-dependency-path: example/front/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test --run
      - run: pnpm build

  submodule-e2e:
    name: Submodule として取り込んで使えるか
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: codegen-src
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: codegen-src/go.mod
          cache-dependency-path: |
            codegen-src/go.sum
            codegen-src/example/server/go.sum
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: codegen-src/example/front/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: codegen-src/example/front/.nvmrc
          cache: pnpm
          cache-dependency-path: codegen-src/example/front/pnpm-lock.yaml
      - name: 空のリポジトリに codegen を Submodule として追加する
        run: |
          git init -b main app
          cd app
          git -c protocol.file.allow=always submodule add "$GITHUB_WORKSPACE/codegen-src" codegen
      - name: codegen.yaml と go.mod を書き、proto を置く（README の手順どおり。codegen は生成物しか置かない）
        working-directory: app
        run: |
          cat > codegen.yaml <<'YAML'
          proto: proto
          targets:
            server:
              out: server
            front:
              out: front/generate
              client: "@/shared/api/apiClient"
            openapi:
              out: docs/openapi
              title: Acme API
              version: 0.1.0
          YAML
          mkdir -p server && (cd server && go mod init example.com/acme/server)
          # サンプルと同じ proto に加えて、サンプルに無い形（整数の主キー、検査の無い entity、文字列以外の path / query パラメータ）も置く
          mkdir -p proto/tag/v1 && cp -R codegen/example/proto/. proto/
          cat > proto/tag/v1/tag.proto <<'PROTO'
          syntax = "proto3";
          package tag.v1;
          // @entity
          message Tag {
            // @pk
            int64 id = 1;
            // @required
            string name = 2;
          }
          // 検査が無い entity（errors / strings を import しない）
          // @entity
          message Badge {
            // @pk
            int32 id = 1;
            string label = 2;
          }
          // 主キーだけの entity（errors だけを使う）
          // @entity
          message Color {
            // @pk
            string code = 1;
          }
          // 文字列以外の path / query パラメータ
          message GetTagRequest {
            int64 id = 1;
            uint32 page = 2;
            uint64 offset = 3;
            bool archived = 4;
          }
          message GetTagResponse { Tag tag = 1; }
          message DeleteBadgeRequest {
            int32 id = 1;
            bool force = 2;
          }
          message DeleteBadgeResponse {}
          service TagService {
            // @http GET /api/tags/{id}
            rpc GetTag(GetTagRequest) returns (GetTagResponse);
            // @http DELETE /api/badges/{id}/{force}
            rpc DeleteBadge(DeleteBadgeRequest) returns (DeleteBadgeResponse);
          }
          PROTO
      - name: 生成と検査
        working-directory: app
        run: |
          make -C codegen proto-gen
          make -C codegen proto-check
          test ! -e server/cmd/api && test ! -e front/package.json   # サンプルの手書きのコードはコピーしない
      - name: server（生成物だけでビルドできる）
        working-directory: app/server
        run: |
          go mod tidy
          go vet ./...
      - name: front（apiClient と依存は使う側が用意する。ここでは example の apiClient を写して型を検査する）
        working-directory: app
        run: |
          mkdir -p front/shared/api
          cp codegen/example/front/{package.json,pnpm-lock.yaml,pnpm-workspace.yaml,tsconfig.json} front/
          cp codegen/example/front/shared/api/{apiClient.ts,errorUtils.ts} front/shared/api/
          cd front
          pnpm install --frozen-lockfile
          pnpm typecheck
      - name: サブディレクトリ（v2/ など）を生成先にできる
        working-directory: app
        run: |
          mkdir -p v2/server
          cp codegen.yaml v2/ && cp -R proto v2/
          (cd v2/server && go mod init example.com/acme/v2/server)
          make -C codegen proto-gen ROOT="$PWD/v2"
          make -C codegen proto-check ROOT="$PWD/v2"
          cd v2/server && go mod tidy && go vet ./...
      - name: Submodule の中が変わっていないこと（どの手順も codegen/ に書き込まない）
        working-directory: app
        run: |
          git -C codegen status --porcelain
          test -z "$(git -C codegen status --porcelain)"
