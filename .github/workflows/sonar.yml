name: SonarQube

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# アクションは、タグではなくコミットハッシュで指定する（更新は Renovate）。
jobs:
  sonar:
    name: SonarQube Cloud の解析
    runs-on: ubuntu-latest
    # SONAR_TOKEN は Environment「sonarcloud」のシークレット（リポジトリ全体のシークレットには置かない）。
    # 承認者やブランチの制限は付けない（PR ごとの解析が止まるため）
    environment: sonarcloud
    # fork からの PR には SONAR_TOKEN が渡らないので解析しない
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 新しいコードの判定（blame）に履歴が要る
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            example/server/go.sum
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: example/front/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: example/front/.nvmrc
          cache: pnpm
          cache-dependency-path: example/front/pnpm-lock.yaml

      - name: Go のカバレッジ（ジェネレータ）
        run: go test -count=1 -coverprofile=coverage.out ./...
      - name: Go のカバレッジ（example/server）
        working-directory: example/server
        run: go test -count=1 -coverprofile=coverage.out ./...
      - name: TypeScript のカバレッジ（example/front）
        working-directory: example/front
        run: |
          pnpm install --frozen-lockfile
          pnpm test:coverage

      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
