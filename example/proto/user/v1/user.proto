syntax = "proto3";

package user.v1;

// User は記事の投稿者。
//
// @entity
message User {
  // @pk @paging
  string id = 1;
  // @unique @email
  string email = 2;
  // @required
  string name = 3;
  // @timestamp
  int64 created_at_unix = 4;
}

message ListUsersRequest {}
message ListUsersResponse {
  repeated User users = 1;
}

// ListUsersByCursorRequest は cursor pagination の入力。
message ListUsersByCursorRequest {
  int32 limit = 1;
  string after_id = 2;
}
message ListUsersByCursorResponse {
  repeated User users = 1;
}

message GetUserRequest {
  string id = 1;
}
message GetUserResponse {
  User user = 1;
}

message GetUserByEmailRequest {
  string email = 1;
}
message GetUserByEmailResponse {
  User user = 1;
}

message CreateUserRequest {
  string email = 1;
  string name = 2;
}
message CreateUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  string id = 1;
  string email = 2;
  string name = 3;
}
message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string id = 1;
}
message DeleteUserResponse {}

service UserService {
  // @http GET /api/users
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // @http GET /api/users/cursor
  rpc ListUsersByCursor(ListUsersByCursorRequest) returns (ListUsersByCursorResponse);

  // @http GET /api/users/by-email
  rpc GetUserByEmail(GetUserByEmailRequest) returns (GetUserByEmailResponse);

  // @http GET /api/users/{id}
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // @http POST /api/users
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

  // @http PATCH /api/users/{id}
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);

  // @http DELETE /api/users/{id}
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}
